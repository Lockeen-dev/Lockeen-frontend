name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build and security baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tracked env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$|.*\.local$)'; then
            echo "Tracked env file found. Remove secrets/env files from git."
            exit 1
          fi

      - name: Validate environment contract
        run: npm run setup:check

      - name: Build
        run: npm run build

      - name: Audit high severity
        run: npm audit --audit-level=high
